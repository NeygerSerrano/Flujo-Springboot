<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Gestión de Carros - Tienda Parking')}"></head>
<body class="bg-light">

    <div th:replace="~{layout :: navbar}"></div>

    <div class="container py-4">
        
        <!-- INICIO DE ZONA DE ALERTAS (Reaccionará a los mensajes del Controlador) -->
        <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
            <strong th:text="${mensajeError}"></strong>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
        </div>

        <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
            <strong th:text="${mensajeExito}"></strong>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
        </div>
        <!-- FIN DE ZONA DE ALERTAS -->

        <div class="row">
            <!-- Columna Izquierda: Formulario -->
            <div class="col-md-4 mb-4">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-primary text-white">
                        <h5 class="card-title mb-0" th:text="${carro.id != null ? 'Editar Vehículo' : 'Registrar Vehículo'}">Registrar Vehículo</h5>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/carros/guardar}" th:object="${carro}" method="post">
                            <!-- Campo oculto para habilitar la edición -->
                            <input type="hidden" th:field="*{id}" />
                            
                            <div class="mb-3">
                                <label class="form-label fw-bold">Placa</label>
                                <input type="text" class="form-control" th:field="*{placa}" placeholder="Ej: ABC-123" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Marca</label>
                                <input type="text" class="form-control" th:field="*{marca}" placeholder="Ej: Toyota" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Modelo</label>
                                <input type="text" class="form-control" th:field="*{modelo}" placeholder="Ej: 2024" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 fw-bold">Guardar Registro</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Columna Derecha: Tabla de Datos -->
            <div class="col-md-8">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-dark text-white">
                        <h5 class="card-title mb-0">Inventario de Carros</h5>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover mb-0">
                                <thead class="table-secondary">
                                    <tr>
                                        <th>ID</th>
                                        <th>Placa</th>
                                        <th>Marca</th>
                                        <th>Modelo</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="c : ${listaCarros}">
                                        <td class="fw-bold" th:text="${c.id}"></td>
                                        <td th:text="${c.placa}"></td>
                                        <td th:text="${c.marca}"></td>
                                        <td th:text="${c.modelo}"></td>
                                        <td>
                                            <a th:href="@{/carros/editar/{id}(id=${c.id})}" class="btn btn-sm btn-outline-primary">Editar</a>
                                            <a th:href="@{/carros/eliminar/{id}(id=${c.id})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('¿Confirma que desea eliminar este vehículo del sistema?');">Eliminar</a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script inyectado desde el layout -->
    <div th:replace="~{layout :: scripts}"></div>
</body>
</html>
