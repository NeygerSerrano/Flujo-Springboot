<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Gestión de Choferes - Tienda Parking')}"></head>
<body class="bg-light">

    <div th:replace="~{layout :: navbar}"></div>

    <div class="container py-4">
        
        <!-- INICIO DE ZONA DE ALERTAS (Reaccionará a los mensajes del Controlador) -->
        <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
            <strong th:text="${mensajeError}"></strong>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
        </div>

        <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
            <strong th:text="${mensajeExito}"></strong>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
        </div>
        <!-- FIN DE ZONA DE ALERTAS -->

        <div class="row">
            <!-- Formulario Chofer -->
            <div class="col-md-4 mb-4">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-success text-white">
                        <h5 class="card-title mb-0" th:text="${chofer.id != null ? 'Editar Chofer' : 'Registrar Chofer'}">Registrar Chofer</h5>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/choferes/guardar}" th:object="${chofer}" method="post">
                            <!-- Campo oculto vital para que funcione el modo Edición -->
                            <input type="hidden" th:field="*{id}" />
                            
                            <div class="mb-3">
                                <label class="form-label fw-bold">Nombre Completo</label>
                                <input type="text" class="form-control" th:field="*{nombre}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Cédula</label>
                                <input type="text" class="form-control" th:field="*{cedula}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Licencia</label>
                                <input type="text" class="form-control" th:field="*{licencia}" required>
                            </div>
                            <button type="submit" class="btn btn-success w-100 fw-bold">Guardar Registro</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Tabla Choferes -->
            <div class="col-md-8">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-dark text-white">
                        <h5 class="card-title mb-0">Directorio de Choferes</h5>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover mb-0">
                                <thead class="table-secondary">
                                    <tr>
                                        <th>ID</th>
                                        <th>Nombre</th>
                                        <th>Cédula</th>
                                        <th>Licencia</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="c : ${listaChoferes}">
                                        <td class="fw-bold" th:text="${c.id}"></td>
                                        <td th:text="${c.nombre}"></td>
                                        <td th:text="${c.cedula}"></td>
                                        <td th:text="${c.licencia}"></td>
                                        <td>
                                            <a th:href="@{/choferes/editar/{id}(id=${c.id})}" class="btn btn-sm btn-outline-primary">Editar</a>
                                            <a th:href="@{/choferes/eliminar/{id}(id=${c.id})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('¿Confirma que desea eliminar este chofer del sistema?');">Eliminar</a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{layout :: scripts}"></div>
</body>
</html>
