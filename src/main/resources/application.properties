spring.application.name=flujo-springboot

# 1. Credenciales para conectar a phpMyAdmin (MySQL)
# El nombre exacto de tu base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/tiendaparking

# Tu usuario de phpMyAdmin (por defecto en XAMPP/WAMP suele ser root)
spring.datasource.username=root

# Tu contraseña (si no tienes, déjalo en blanco después del igual)
spring.datasource.password=

# 2. Instrucción de cómo manejar las tablas (Parte crucial)
spring.jpa.hibernate.ddl-auto=update