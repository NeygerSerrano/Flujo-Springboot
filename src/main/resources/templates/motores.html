<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Gestión de Motores - Tienda Parking')}"></head>
<body class="bg-light">

    <div th:replace="~{layout :: navbar}"></div>

    <div class="container py-4">
        <div class="row">
            <!-- Formulario Motor -->
            <div class="col-md-4 mb-4">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-danger text-white">
                        <h5 class="card-title mb-0" th:text="${motor.id != null ? 'Editar Motor' : 'Registrar Motor'}">Registrar Motor</h5>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/motores/guardar}" th:object="${motor}" method="post">
                            <input type="hidden" th:field="*{id}" />
                            
                            <div class="mb-3">
                                <label class="form-label fw-bold">Número de Serie</label>
                                <input type="text" class="form-control" th:field="*{numero_serie}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Tipo</label>
                                <input type="text" class="form-control" th:field="*{tipo}" placeholder="Ej. Gasolina, Eléctrico" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Caballos de Fuerza</label>
                                <input type="text" class="form-control" th:field="*{caballos_fuerza}" required>
                            </div>
                            <button type="submit" class="btn btn-danger w-100 fw-bold">Guardar Registro</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Tabla Motores -->
            <div class="col-md-8">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-dark text-white">
                        <h5 class="card-title mb-0">Inventario de Motores</h5>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover mb-0">
                                <thead class="table-secondary">
                                    <tr>
                                        <th>ID</th>
                                        <th>Número de Serie</th>
                                        <th>Tipo</th>
                                        <th>Caballos de Fuerza</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="m : ${listaMotores}">
                                        <td class="fw-bold" th:text="${m.id}"></td>
                                        <td th:text="${m.numero_serie}"></td>
                                        <td th:text="${m.tipo}"></td>
                                        <td th:text="${m.caballos_fuerza}"></td>
                                        <td>
                                            <a th:href="@{/motores/editar/{id}(id=${m.id})}" class="btn btn-sm btn-outline-primary">Editar</a>
                                            <a th:href="@{/motores/eliminar/{id}(id=${m.id})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('¿Confirma que desea eliminar este motor?');">Eliminar</a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{layout :: scripts}"></div>
</body>
</html>
